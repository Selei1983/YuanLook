name: YuanLook validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./internal/... ./pkg/agent/...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: npm run lint --prefix web
      - name: Read pinned default theme
        run: echo "DEFAULT_THEME_REF=$(tr -d '\r\n' < .github/default-theme.ref)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: pika-monitor/pika-default-theme
          ref: ${{ env.DEFAULT_THEME_REF }}
          path: pika-default-theme
      - run: make DEFAULT_THEME_DIR=pika-default-theme build-default-theme
